name: E2E Integration

# Runs the testnet e2e lanes on any ref, on manual dispatch. The `testnet-e2e`
# job in release.yml runs only for a release (a version tag push or a
# dispatch with a release tag).
#
# This workflow builds nothing for distribution, uploads nothing to a release
# and has no write permission.

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Which lane(s) to run"
        type: choice
        options:
          - all
          - agg
          - liq
          - stress
          - flash
          - blend
          - production
          - sdk
        default: all
      lane_timeout:
        description: "Per-lane wall-clock cap (e.g. 95m, 45m)"
        required: false
        default: "95m"

permissions:
  contents: read

env:
  STELLAR_VERSION: "28.0.0"
  # Fixed, not a workflow input. The harness deploys contracts and moves funds,
  # and `configs/networks.json` also defines `mainnet`: an input would make a
  # mainnet deploy one click away. The local harness also rejects other networks.
  NETWORK: testnet

concurrency:
  # Shares the `testnet-e2e` group with release.yml for mutual exclusion: both
  # workflows drive the same testnet, friendbot and aggregator API, and
  # overlapping runs fail in ways that look like protocol bugs. Queue, never
  # cancel: a half-finished run leaves funded wallets and deployed contracts
  # behind.
  group: testnet-e2e
  cancel-in-progress: false

jobs:
  build:
    name: Build canonical candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none
      - run: bash .github/scripts/install-stellar-cli.sh
      - run: make candidate-wasm candidate-size-check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Offline pinned SDK RPC fixtures
        run: |
          npm ci --ignore-scripts --prefix tests/integration/sdk
          make integration-sdk-validate

      - run: make integration-validate
      - name: Contract and controlled-ledger proofs
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee controlled-tests.log
          python3 tests/integration/controlled.py controlled-tests.log artifacts/wasm/deploy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-wasm
          path: artifacts/wasm/deploy
          if-no-files-found: error

      - name: Upload offline verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-ledger-log
          path: controlled-tests.log
          if-no-files-found: warn

  e2e:
    needs: build
    name: Testnet e2e (${{ inputs.lanes }})
    runs-on: self-hosted
    # Above the 95m default lane cap, leaving room for the WASM build ahead of
    # it. Queue time is not counted against this.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Install harness tools
        run: |
          if command -v jq >/dev/null 2>&1 && command -v xxd >/dev/null 2>&1; then
            echo "jq + xxd already present"; exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q jq xxd

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-wasm
          path: artifacts/wasm/deploy
      - name: Verify candidates and build separate fixtures
        run: |
          python3 tests/integration/artifacts.py check artifacts/wasm/deploy
          make integration-fixtures

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned published SDK
        run: npm ci --ignore-scripts --prefix tests/integration/sdk

      - name: Run testnet e2e
        env:
          RUN_TS: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_LANES: ${{ inputs.lanes == 'all' && 'agg liq stress flash blend production sdk' || inputs.lanes }}
          LANE_TIMEOUT: ${{ inputs.lane_timeout }}
        run: bash tests/integration/scenarios/parallel_e2e.sh

      - name: Publish combined report to job summary
        if: always()
        env:
          RUN_TS: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          combined="tests/integration/runs/${RUN_TS}-combined.md"
          if [ -f "$combined" ]; then
            cat "$combined" >> "$GITHUB_STEP_SUMMARY"
          else
            # No combined report means the orchestrator failed before it wrote
            # one. Say so, so that an empty summary does not read as a clean run.
            {
              echo "# E2E Integration — ${RUN_TS}"
              echo
              echo "**No combined report produced.** The run failed before the"
              echo "orchestrator wrote one; see the uploaded lane logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ inputs.lanes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-combined.md
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/report.md
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/actions.tsv
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/attempts.jsonl
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/cases.tsv
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/evidence.tsv
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/cleanup-funding.tsv
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/before-cleanup.jsonl
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/deployed-artifacts.jsonl
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/*.json
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*/logs/**
            tests/integration/runs/e2e-${{ github.run_id }}-${{ github.run_attempt }}-*.log
          # Warn only: a missing report must not hide the error of the step
          # that failed first.
          if-no-files-found: warn
