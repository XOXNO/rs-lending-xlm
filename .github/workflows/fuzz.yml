name: Fuzz

on:
  pull_request:
    branches: [master, main, feat/*, rc/*]
    paths:
      - 'common/**'
      - 'contracts/pool/**'
      - 'contracts/controller/**'
      - 'contracts/governance/**'
      - 'tests/test-harness/**'
      - 'tests/fuzz/**'
  schedule:
    # The long suites run in two windows rather than together. This predates the
    # dedicated mutation box: every `self-hosted` lane used to be a runner
    # service on ONE 32-core host, and sharing 02:00 meant mutants(4 lanes) +
    # fuzz(6) + proptest(5) = 15 concurrent jobs on 32 cores. Jobs select their
    # window with startsWith() on the cron.
    #
    # The mutation matrix is now label-pinned to its own box, so the windows no
    # longer overlap on hardware and could in principle be merged. Left split
    # until the new box has run a full nightly and its core budget is confirmed
    # — collapsing them is a one-line change, un-collapsing after a bad night is
    # not.
    #
    # 02:00 UTC — mutation matrix.
    - cron: '0 2 * * 1-6'
    - cron: '0 2 * * 0'
    # 14:00 UTC — fuzz + proptest. Sunday is the deep run (longer FUZZ_TIME,
    # more PROPTEST_CASES); Monday-Saturday is standard.
    - cron: '0 14 * * 1-6'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Long-running suite to execute (one at a time — see schedule)'
        type: choice
        # No `all`. Every self-hosted lane is a runner service on the same
        # 32-core box, which is why the schedule splits mutants (02:00) from
        # fuzz+proptest (14:00). `all` let a manual dispatch put all 15 lanes
        # back on one box and undo that split — run 30496414050 was exactly
        # this, and every mutation lane failed on contention timeouts. Dispatch
        # one suite at a time; the separation is structural now, not a
        # convention the scheduler happens to follow.
        options:
          - fuzz
          - proptest
          - mutants
        default: mutants
      fuzz_time:
        description: 'Seconds per function-level target'
        required: false
        default: '300'
      proptest_cases:
        description: 'Cases per contract-level property test'
        required: false
        default: '5000'

env:
  CARGO_TERM_COLOR: always
  STELLAR_VERSION: '27.0.0'
  CARGO_MUTANTS_VERSION: '27.1.0'
  # Pin untrusted workflow_dispatch inputs into env to avoid injection.
  FUZZ_TIME_INPUT: ${{ github.event.inputs.fuzz_time }}
  PROPTEST_CASES_INPUT: ${{ github.event.inputs.proptest_cases }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR gate: fast smoke (5 min total).
  pr-smoke:
    if: github.event_name == 'pull_request'
    name: Fuzz smoke (PR)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # Job-private rustup dir: the persistent runner shares one $HOME/.rustup
      # across concurrent jobs, so parallel toolchain installs race and wedge
      # (rust-std-wasm32v1-none component conflict).
      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: wasm32v1-none

      - name: Install Rust nightly (for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz (prebuilt)
        # Was `cargo install cargo-fuzz --locked` (compiled from source every
        # run). install-action fetches a prebuilt binary in seconds.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('Cargo.lock', 'tests/fuzz/Cargo.lock') }}

      - name: Install stellar-cli
        # Version pinned via workflow env (stellar-cli, independent of the soroban-sdk crate pin).
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Build pool WASM (required by test-harness)
        run: stellar contract build

      - name: Function-level fuzz (30s each)
        run: make fuzz FUZZ_TIME=30

      - name: Contract-level fuzz smoke (60s each)
        # PR-only smoke; full long-run lives in the nightly job below.
        run: make fuzz-contract FUZZ_TIME=60

      - name: Contract-level property suite
        run: make proptest

  miri:
    if: github.event_name == 'pull_request'
    name: Miri pass (common fp_core)
    runs-on: self-hosted
    # rust-toolchain.toml pins the repo to 1.95, but this job is nightly-only and
    # its isolated RUSTUP_HOME never installs 1.95. Pin the job to nightly so
    # dtolnay's cachekey and any bare rustc/cargo resolve to the installed
    # nightly instead of the absent 1.95. `make miri-all` uses `cargo +nightly`.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      # Job-private rustup dir: the persistent runner shares one $HOME/.rustup
      # across concurrent jobs, so parallel toolchain installs race and wedge
      # (rust-std-wasm32v1-none component conflict).
      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: make miri-all

  # PR gate: mutate only the lines this PR changes so test-coverage gaps
  # surface at review time instead of in the nightly full run. Early signal
  # only — the nightly per-scope jobs stay authoritative (this job
  # feature-unifies the workspace with the harness's `testing` feature, so
  # governance validators behind cfg(not(feature = "testing")) are only
  # mutation-tested nightly).
  mutants-diff:
    if: github.event_name == 'pull_request'
    name: Mutants (PR diff) ${{ matrix.shard }}
    runs-on: self-hosted
    timeout-minutes: 360
    strategy:
      # Each shard tests a disjoint 1/N slice of the diff's mutants on its own
      # runner, so wall time drops ~linearly with the shard count. `fail-fast:
      # false` lets every shard report its own missed mutants instead of one
      # shard cancelling the rest.
      fail-fast: false
      matrix:
        # 0..N-1; keep in sync with the `/N` denominator in the run step.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Job-private rustup dir: the persistent runner shares one $HOME/.rustup
      # across concurrent jobs, so parallel toolchain installs race and wedge
      # (rust-std-wasm32v1-none component conflict).
      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: wasm32v1-none

      # cargo-mutants runs the tests; nextest parallelises the surviving-mutant
      # test runs; mold slashes the per-mutant native relink (the real
      # bottleneck), applied to the HOST target only (see RUSTFLAGS below) so
      # the wasm32v1-none fixture build keeps its own linker.
      - name: Install cargo-mutants + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }},cargo-nextest

      # mold slashes the per-mutant native relink (the real bottleneck), but it
      # is a C++ linker (not a cargo tool) and needs gcc >= 12.1 to drive it.
      # Install it from the official release and enable `-fuse-ld=mold` for the
      # HOST target ONLY if a real rustc link test succeeds — so a download
      # failure or an older gcc falls back to the default linker instead of
      # breaking the shard. Never applied to the wasm32v1-none fixture build.
      - name: Setup mold (best-effort host linker)
        run: |
          set -u
          MOLD_VER=2.34.1
          MOLD_DIR="$RUNNER_TEMP/mold-${MOLD_VER}-x86_64-linux"
          if ! curl -fsSL "https://github.com/rui314/mold/releases/download/v${MOLD_VER}/mold-${MOLD_VER}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"; then
            echo "mold download failed; using default linker"
            exit 0
          fi
          echo "$MOLD_DIR/bin" >> "$GITHUB_PATH"
          echo 'fn main(){}' > "$RUNNER_TEMP/moldcheck.rs"
          if PATH="$MOLD_DIR/bin:$PATH" rustc -C link-arg=-fuse-ld=mold -o "$RUNNER_TEMP/moldcheck" "$RUNNER_TEMP/moldcheck.rs" 2>/dev/null; then
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled for host builds"
          else
            echo "toolchain cannot link with mold (gcc < 12.1?); using default linker"
          fi

      # Per-shard `target-mutants` cache: `--in-place` reuses the warm tree, so
      # each shard's incremental per-mutant rebuild stays fast. `target/` is
      # deliberately NOT cached (wasm fixtures are rebuilt from source; a
      # restored `target/` can resurrect artifacts from an older commit).
      #
      # NEVER add `mutants.out` here. `--iterate` reads the previously-caught
      # and unviable lists out of `mutants.out.old/`; persisting those across
      # runs would make a later run skip mutants that were only ever caught
      # against an OLDER commit — a silent coverage hole, which is the one
      # failure mode mutation testing exists to prevent.
      #
      # This cache is also useless for the nightly matrix, which runs in scratch
      # mode: cargo-mutants' tree copy honours .gitignore and `copy_target`
      # defaults to false, so `target-mutants` is never copied into a worker's
      # build dir. Caching it there is pure tar/untar cost.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-mutants
          key: ${{ runner.os }}-mutants-diff-v3-s${{ matrix.shard }}-${{ hashFiles('Cargo.lock', '.cargo/mutants.toml') }}
          restore-keys: |
            ${{ runner.os }}-mutants-diff-v3-s${{ matrix.shard }}-
            ${{ runner.os }}-mutants-diff-v3-
            ${{ runner.os }}-mutants-diff-v2-

      # Caching a tree that an --in-place run wrote to is a mutant-poisoning
      # vector, and it crosses runs: cargo-mutants reverts each mutant (giving
      # the source a newer mtime than the mutant-built rlib, so cargo rebuilds),
      # but a job killed between build and revert leaves a mutant rlib behind —
      # and actions/cache saves on failure too. The next run restores it and
      # links the mutant into an ordinary build. Same class of bug tests.yml
      # resets `target/` for. Re-stamping every source after restore guarantees
      # sources are newer than anything the cache carried in.
      - name: Invalidate any mutant-built artifacts from the cache
        run: git ls-files -z '*.rs' | xargs -0 touch

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Compute PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE_SHA"...HEAD > pr.diff

      - name: Mutate changed lines (shard ${{ matrix.shard }}/4)
        env:
          # `--in-place` keeps this shard's `target-mutants` cache warm (fast
          # incremental per mutant) and is inherently serial — so parallelism
          # comes from the shard matrix (across runners), while each serial
          # mutant build still uses all 8 cores via CARGO_BUILD_JOBS. This
          # beats `-j` (copy-based, which cold-builds per worker and loses the
          # cache) for a cache-warm runner.
          CARGO_BUILD_JOBS: '8'
          CARGO_TARGET_DIR: target-mutants
          # nextest ignores RUST_TEST_THREADS and defaults to one process per
          # core, so 4 shards x 32 = 128 test processes on 32 cores. In-place is
          # serial, so only 4 mutants are ever in flight: 4 x 8 = 32 matches
          # both this and the CARGO_BUILD_JOBS budget above.
          NEXTEST_TEST_THREADS: '8'
          # mold's host RUSTFLAGS is exported to $GITHUB_ENV by the setup step
          # above only when a link test proves the toolchain supports it.
        run: >-
          make mutants-diff
          MUTANTS_RUN_MODE=--in-place
          MUTANTS_SHARD=${{ matrix.shard }}/4
          MUTANTS_TEST_TOOL=nextest

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-artifacts-diff-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 7

  stellar-tool:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Prepare stellar-cli
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Stage stellar-cli
        run: |
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          if [ -x "$HOME/.local/bin/stellar" ]; then
            cp "$HOME/.local/bin/stellar" "$RUNNER_TEMP/stellar-cli/stellar"
          else
            cp "$(command -v stellar)" "$RUNNER_TEMP/stellar-cli/stellar"
          fi
          chmod +x "$RUNNER_TEMP/stellar-cli/stellar"

      - name: Upload stellar-cli
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stellar-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stellar-cli/stellar

  mutants-tool:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 2 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'mutants')
    name: Prepare cargo-mutants
    runs-on: self-hosted
    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      # Scratch mode gives every cargo-mutants worker a fresh build dir, and the
      # tree copy honours .gitignore — so `target-mutants` is never copied in and
      # each worker would otherwise cold-build the entire dependency graph. Over
      # a night that is hundreds of rebuilds of a bit-identical dep tree.
      # sccache collapses them; `CARGO_INCREMENTAL: '0'` on the run step is its
      # hard prerequisite. Same wrapper tests.yml/coverage.yml use.
      #
      # Installed here rather than per lane: install-action's target is the
      # shared $HOME/.cargo/bin, so concurrent lanes clobber each other's
      # unpack. This job is the only writer.
      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Stage tools
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-mutants/bin"
          cp "$(command -v cargo-mutants)" "$RUNNER_TEMP/cargo-mutants/bin/cargo-mutants"
          cp "$(command -v sccache)" "$RUNNER_TEMP/cargo-mutants/bin/sccache"

      - name: Upload cargo-mutants
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cargo-mutants-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-mutants/bin/cargo-mutants

      - name: Upload sccache
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sccache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-mutants/bin/sccache

  # The mutation harness reads three prebuilt wasm fixtures by absolute path
  # (POOL_WASM_PATH, CONTROLLER_WASM_PATH, PRICE_AGGREGATOR_WASM_PATH). They are
  # identical for every scope, but `_mutants-harness-prepare` used to rebuild
  # them per matrix job — a full lto="fat" wasm build, at CARGO_BUILD_JOBS=1,
  # competing with the mutation lanes, once per job.
  #
  # Building once here also makes staleness structurally impossible rather than
  # merely detected: the artifact is keyed to this run, so every consumer
  # provably has fixtures from the same commit it is mutating.
  wasm-fixtures:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 2 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'mutants')
    name: Prepare wasm fixtures
    runs-on: self-hosted
    needs: stellar-tool
    steps:
      - uses: actions/checkout@v7

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: wasm32v1-none

      - name: Download stellar-cli
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/tools

      - name: Add stellar-cli to PATH
        run: |
          chmod +x .github/tools/stellar
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Build wasm fixtures
        env:
          CARGO_TARGET_DIR: target-mutants
        run: make build

      # sha256 manifest is the primary integrity guard for consumers; the
      # export grep stays as a zero-cost tripwire against a fixture that builds
      # but is missing the ABI the harness expects.
      - name: Stage fixtures
        env:
          CARGO_TARGET_DIR: target-mutants
        run: |
          set -euo pipefail
          src=target-mutants/wasm32v1-none/release
          dst="$RUNNER_TEMP/wasm-fixtures"
          mkdir -p "$dst"
          for w in pool controller price_aggregator; do
            cp "$src/$w.wasm" "$dst/$w.wasm"
          done
          grep -aq set_swap_aggregator "$dst/controller.wasm" \
            || { echo "controller.wasm is missing the set_swap_aggregator export" >&2; exit 1; }
          (cd "$dst" && sha256sum ./*.wasm > SHA256SUMS)
          cat "$dst/SHA256SUMS"

      - name: Upload wasm fixtures
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-fixtures/

  # Nightly/manual: one job per libFuzzer target. A 32-core runner can run the
  # six single-core fuzzers concurrently when enough runner services are online.
  fuzz-long:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 14 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'fuzz')
    name: Fuzz long (${{ matrix.target }})
    runs-on: self-hosted
    needs: stellar-tool
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: fp_math
            kind: function
          - target: rates_and_index
            kind: function
          - target: fp_ops
            kind: function
          - target: flow_e2e
            kind: contract
          - target: flow_strategy
            kind: contract
          - target: pool_native
            kind: contract
    steps:
      - uses: actions/checkout@v7

      # Job-private rustup dir: the persistent runner shares one $HOME/.rustup
      # across concurrent jobs, so parallel toolchain installs race and wedge
      # (rust-std-wasm32v1-none component conflict).
      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: wasm32v1-none

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'tests/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Download stellar-cli
        if: matrix.kind == 'contract'
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/tools

      - name: Add stellar-cli to PATH
        if: matrix.kind == 'contract'
        run: |
          chmod +x .github/tools/stellar
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Build pool WASM
        if: matrix.kind == 'contract'
        run: stellar contract build

      - name: Run fuzz target
        env:
          FUZZ_TIME: ${{ env.FUZZ_TIME_INPUT || (github.event.schedule == '0 14 * * 0' && '7200' || '1800') }}
          CARGO_BUILD_JOBS: '1'
        run: make fuzz-one TARGET="${{ matrix.target }}" FUZZ_TIME="$FUZZ_TIME"

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/fuzz/artifacts/${{ matrix.target }}/

  proptest-long:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 14 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'proptest')
    name: Proptest (${{ matrix.test }})
    runs-on: self-hosted
    needs: stellar-tool
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        test:
          - prop_accounting_conservation
          - prop_liquidation_matches_bigrational_reference
          - prop_valid_multiply_fits_default_budget
          - prop_multiply_succeeds_with_safe_hf_and_clean_router
          - prop_swap_collateral_conserves_position_delta
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-proptest-${{ matrix.test }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proptest-

      - name: Download stellar-cli
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/tools

      - name: Add stellar-cli to PATH
        run: |
          chmod +x .github/tools/stellar
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Build pool WASM
        run: stellar contract build

      - name: Run proptest property
        env:
          PROPTEST_CASES: ${{ env.PROPTEST_CASES_INPUT || (github.event.schedule == '0 14 * * 0' && '50000' || '5000') }}
          CARGO_BUILD_JOBS: '1'
        run: make proptest-one TEST="${{ matrix.test }}" PROPTEST_CASES="$PROPTEST_CASES"

      - name: Upload proptest regressions on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: proptest-regressions-${{ matrix.test }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-harness/tests/fuzz/*.proptest-regressions

  mutants:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 2 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'mutants')
    name: Mutants (${{ matrix.target }}${{ matrix.suffix || '' }})
    # Pinned to the dedicated box. `rs-lending-xlm` is carried only by the three
    # repo-level runner services on it; the org-level pool (Runner-1/2/3 and
    # Ubuntu-2004-focal-64-minimal, all four services on one shared host) does
    # not have it. Bare `self-hosted` matches both pools, so without this label
    # the matrix lands wherever and the per-box worker budget below means
    # nothing. Fuzz and proptest still run unpinned on the shared host.
    runs-on: [self-hosted, rs-lending-xlm]
    needs: [stellar-tool, mutants-tool, wasm-fixtures]
    # A wedged lane holds a runner service for the whole window. Scheduled runs
    # do not cancel-in-progress, so an over-long run also queues the next night.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Lanes are runner services on ONE box, so they do not add compute — they
      # only partition it. Effective parallelism is min(this cap, runner
      # services registered on the box). Raising the cap alone changes nothing:
      # a lane needs a service to run on, so with three services registered the
      # 4th..8th lanes queue exactly as they did at max-parallel: 3. Register
      # more services on the box to actually cash this in.
      #
      # The other half is the worker budget: 8 lanes x MUTANTS_JOBS: 8 = 64
      # mutants in flight, and 8 is inherited from the old 32-core host. The
      # "Report host capacity" step below prints nproc so the two can be
      # re-derived together — the product is what lands on the cores.
      max-parallel: 8
      matrix:
        # Sharding splits one scope's mutant list across lanes. On a single box
        # it buys tail latency only (it cannot add throughput) and costs one job
        # setup per shard, so shard only what is big enough to become the tail.
        # Measured wall times from run 30515825968 drive the split below.
        # `suffix` keeps job and artifact names unique.
        #
        # Sharding a multi-pass scope only pays when the SHARDED pass is the
        # expensive one. Only the final pass takes --shard (see the
        # --shard/--iterate note in the Makefile); every earlier pass runs the
        # whole scope in every lane, so a split scope pays for those passes once
        # per lane.
        #
        # Longest-processing-time-first ordering: with a fixed lane count this
        # greedy order minimises the tail. Keep new entries in size order.
        include:
          # 167 min, three-pass. Unsharded: its two costly passes (common's own
          # tests, then native consumers) are the unsharded ones, and the only
          # pass a split would divide is the integration pass over the handful
          # of mutants those two leave alive. Splitting duplicated ~everything
          # to divide ~nothing.
          - target: mutants-common
          # 173 min and 153 min of total work respectively. Both stay split:
          # unsharded, either would sit near the whole-matrix floor once the
          # other savings land, making it the new tail. Their unsharded pass is
          # the cheap native-controller one; the harness pass is what splits.
          - target: mutants-controller-views
            shard: 0/2
            suffix: '-1of2'
          - target: mutants-controller-views
            shard: 1/2
            suffix: '-2of2'
          - target: mutants-controller-core
            shard: 0/2
            suffix: '-1of2'
          - target: mutants-controller-core
            shard: 1/2
            suffix: '-2of2'
          - target: mutants-controller-strategies
          # 69 min across its two shards — comfortably under the floor, so the
          # split was pure setup overhead. Unsharded.
          - target: mutants-controller-positions
          - target: mutants-oracle-adapter
          - target: mutants-aggregator
          - target: mutants-pool
          - target: mutants-governance
          - target: mutants-defindex-strategy
          - target: mutants-controller-oracle
    steps:
      - uses: actions/checkout@v7

      # Job-private rustup dir: the persistent runner shares one $HOME/.rustup
      # across concurrent jobs, so parallel toolchain installs race and wedge
      # (rust-std-wasm32v1-none component conflict). Every other heavy job in
      # this file does this; the mutation matrix runs `max-parallel` lanes and
      # needs it just as much.
      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      # No `targets: wasm32v1-none` here: fixtures arrive prebuilt from the
      # wasm-fixtures job, so this matrix never invokes a wasm build. That also
      # removes the rust-std-wasm32v1-none component install that races across
      # concurrent lanes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'

      - name: Download stellar-cli
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/tools

      - name: Download cargo-mutants
        uses: actions/download-artifact@v8.0.1
        with:
          name: cargo-mutants-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/tools

      # Downloaded, not installed here. taiki-e/install-action writes to the
      # shared $HOME/.cargo/bin, which every concurrent lane on this box also
      # owns: lanes untar over each other (`tar: Cannot utime`) and exec a
      # binary another lane is still writing (`Text file busy`, exit 126). Same
      # shared-$HOME race the RUSTUP_HOME isolation above exists for; the tool
      # jobs already solve it by installing once and shipping an artifact.
      - name: Download sccache
        uses: actions/download-artifact@v8.0.1
        with:
          name: sccache-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/tools

      # Into the exact CARGO_TARGET_DIR path MUTANTS_ENV points the harness
      # loaders at, so scratch workers resolve them by absolute path.
      - name: Download wasm fixtures
        uses: actions/download-artifact@v8.0.1
        with:
          name: wasm-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-mutants/wasm32v1-none/release

      - name: Add tools to PATH
        run: |
          chmod +x .github/tools/stellar .github/tools/cargo-mutants .github/tools/sccache
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Configure fast host linker
        shell: bash
        run: |
          if command -v mold >/dev/null 2>&1; then
            linker=mold
            mold --version
          elif command -v ld.lld >/dev/null 2>&1; then
            linker=lld
            ld.lld --version
          else
            echo "Install mold (preferred) or lld on the self-hosted runner." >&2
            exit 1
          fi
          command -v cc >/dev/null 2>&1 || {
            echo "A C compiler driver (cc) is required for the fast linker." >&2
            exit 1
          }
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=$linker" >> "$GITHUB_ENV"

      # The lane and worker counts are budgeted against this box's cores, so
      # print what the box actually has. Cheap, and it means the numbers can be
      # re-derived from a run's own log instead of a guess.
      - name: Report host capacity
        run: |
          echo "host=$(hostname) cores=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          echo "lanes=${MAX_PARALLEL:-8} workers_per_lane=${MUTANTS_JOBS:-8}"
        env:
          MUTANTS_JOBS: '8'

      - name: Run mutation target
        # Scratch mode is required for cargo-mutants worker parallelism, and
        # target-mutants stays isolated from ordinary build/test artifacts.
        #
        # Concurrency budget on the pinned box, where L = max-parallel,
        # W = MUTANTS_JOBS, and every knob below is per-process, not global:
        #   mutants in flight  L x W                    = 8 x 8  = 64
        #   test threads       L x W x RUST_TEST_THREADS= 8x8x1  = 64
        #   build tokens       L x MUTANTS_JOBSERVER_TASKS = 8x8 = 64
        # W is still 8 because that is what the previous host's 32 cores
        # supported, and L is now 8 by request. 64 is only right if this box has
        # ~64 usable cores — check "Report host capacity" above against it. If
        # it does not, W is the knob to cut, not L: fewer workers per lane keeps
        # the tail-cutting benefit of more lanes.
        #
        # RUST_TEST_THREADS and --jobserver-tasks both default to NCPUS *per
        # process*, which put 1024 test threads and 128 build tokens on 32
        # cores. Pinning them is pure scheduling: no mutant verdict depends on
        # it, and `make test` already runs the harness at --test-threads=1.
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_TARGET_DIR: target-mutants
          MUTANTS_JOBS: '8'
          MUTANTS_JOBSERVER_TASKS: '8'
          # Fixtures come from the wasm-fixtures artifact; verify, don't rebuild.
          MUTANTS_FIXTURES_PREBUILT: '1'
          RUST_TEST_THREADS: '1'
          RUSTC_WRAPPER: sccache
          SCCACHE_CACHE_SIZE: 50G
        run: make "${{ matrix.target }}" MUTANTS_SHARD="${{ matrix.shard || '' }}"

      # Hit rate on third-party crates should be high after the first wave; a
      # low rate means the scratch workers are still cold-building deps.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-artifacts-${{ matrix.target }}${{ matrix.suffix || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          # mutants.out.old/ holds the earlier passes of the multi-pass macros;
          # without it the artifact only shows the final pass, which makes a
          # verdict-set diff against a control run impossible.
          path: |
            mutants.out/
            mutants.out.old/
          if-no-files-found: ignore
          retention-days: 7
