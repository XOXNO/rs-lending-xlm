name: Fuzz

on:
  pull_request:
    branches: [master, main, feat/*, rc/*]
    paths:
      - "common/**"
      - "contracts/pool/**"
      - "contracts/controller/**"
      - "contracts/governance/**"
      - "tests/test-harness/**"
      - "tests/fuzz/**"
  schedule:
    - cron: "0 2 * * 1-6"
    - cron: "0 2 * * 0"
    - cron: "0 14 * * 1-6"
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "Long-running suite(s) to execute (all runs fuzz + proptest + mutants together)"
        type: choice

        options:
          - all
          - fuzz
          - proptest
          - mutants
        default: all
      fuzz_time:
        description: "Seconds per function-level target"
        required: false
        default: "300"
      proptest_cases:
        description: "Cases per contract-level property test"
        required: false
        default: "5000"

env:
  CARGO_TERM_COLOR: always
  STELLAR_VERSION: "27.0.0"
  CARGO_MUTANTS_VERSION: "27.1.0"

  FUZZ_TIME_INPUT: ${{ github.event.inputs.fuzz_time }}
  PROPTEST_CASES_INPUT: ${{ github.event.inputs.proptest_cases }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-smoke:
    if: github.event_name == 'pull_request'
    name: Fuzz smoke (PR)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Install Rust nightly (for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz (prebuilt)
        # Was `cargo install cargo-fuzz --locked` (compiled from source every
        # run). install-action fetches a prebuilt binary in seconds.
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-fuzz

      # Only build artifacts are cached, never ~/.cargo. Every self-hosted
      # runner instance shares one CARGO_HOME (/home/truststaking/.cargo), so
      # the registry is global while the jobs are concurrent. Cargo itself is
      # safe there -- it serialises on .package-cache -- but actions/cache
      # knows nothing of that lock and unpacks its tarball straight over the
      # live registry, so a job compiling at that moment can read a
      # half-written crate source. That is the base64 E0583 in run 31214351035.
      # The registry needs no cache anyway: it persists on the runner.
      - name: Cache cargo build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
            tests/fuzz/target
          key: ${{ runner.os }}-fuzz-v2-${{ hashFiles('Cargo.lock', 'tests/fuzz/Cargo.lock') }}

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Build pool WASM (required by test-harness)
        run: stellar contract build

      - name: Function-level fuzz (30s each)
        run: make fuzz FUZZ_TIME=30

      - name: Contract-level fuzz smoke (60s each)

        run: make fuzz-contract FUZZ_TIME=60

      - name: Contract-level property suite
        run: make proptest

  miri:
    if: github.event_name == 'pull_request'
    name: Miri pass (common fp_core)
    runs-on: self-hosted

    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: make miri-all

  mutants-diff:
    if: github.event_name == 'pull_request'
    name: Mutants (PR diff) ${{ matrix.shard }}
    runs-on: self-hosted
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Install cargo-mutants + nextest
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }},cargo-nextest

      - name: Setup mold (best-effort host linker)
        run: |
          set -u
          MOLD_VER=2.34.1
          MOLD_DIR="$RUNNER_TEMP/mold-${MOLD_VER}-x86_64-linux"
          if ! curl -fsSL "https://github.com/rui314/mold/releases/download/v${MOLD_VER}/mold-${MOLD_VER}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"; then
            echo "mold download failed; using default linker"
            exit 0
          fi
          echo "$MOLD_DIR/bin" >> "$GITHUB_PATH"
          echo 'fn main(){}' > "$RUNNER_TEMP/moldcheck.rs"
          if PATH="$MOLD_DIR/bin:$PATH" rustc -C link-arg=-fuse-ld=mold -o "$RUNNER_TEMP/moldcheck" "$RUNNER_TEMP/moldcheck.rs" 2>/dev/null; then
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled for host builds"
          else
            echo "toolchain cannot link with mold (gcc < 12.1?); using default linker"
          fi

      # Only build artifacts are cached, never ~/.cargo. Every self-hosted
      # runner instance shares one CARGO_HOME (/home/truststaking/.cargo), so
      # the registry is global while the jobs are concurrent. Cargo itself is
      # safe there -- it serialises on .package-cache -- but actions/cache
      # knows nothing of that lock and unpacks its tarball straight over the
      # live registry, so a job compiling at that moment can read a
      # half-written crate source. That is the base64 E0583 in run 31214351035.
      # The registry needs no cache anyway: it persists on the runner.
      - name: Cache cargo build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target-mutants
          key: ${{ runner.os }}-mutants-diff-v4-s${{ matrix.shard }}-${{ hashFiles('Cargo.lock', '.cargo/mutants.toml') }}
          restore-keys: |
            ${{ runner.os }}-mutants-diff-v4-s${{ matrix.shard }}-
            ${{ runner.os }}-mutants-diff-v4-

      - name: Invalidate any mutant-built artifacts from the cache
        run: git ls-files -z '*.rs' | xargs -0 touch

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Compute PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE_SHA"...HEAD > pr.diff

      - name: Mutate changed lines (shard ${{ matrix.shard }}/4)
        env:
          CARGO_BUILD_JOBS: "8"
          CARGO_TARGET_DIR: target-mutants

          NEXTEST_TEST_THREADS: "8"

        run: >-
          make mutants-diff
          MUTANTS_RUN_MODE=--in-place
          MUTANTS_SHARD=${{ matrix.shard }}/4
          MUTANTS_TEST_TOOL=nextest

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-artifacts-diff-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 7

  stellar-tool:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Prepare stellar-cli
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Stage stellar-cli
        run: |
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          if [ -x "$HOME/.local/bin/stellar" ]; then
            cp "$HOME/.local/bin/stellar" "$RUNNER_TEMP/stellar-cli/stellar"
          else
            cp "$(command -v stellar)" "$RUNNER_TEMP/stellar-cli/stellar"
          fi
          chmod +x "$RUNNER_TEMP/stellar-cli/stellar"

      - name: Upload stellar-cli
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stellar-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/stellar-cli/stellar
          overwrite: true

  mutants-tool:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 2 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'mutants' || inputs.suite == 'all'))
    name: Prepare cargo-mutants
    runs-on: self-hosted
    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      # One install-action for all three, as the mutants-diff job already does.
      # Staging them here rather than installing per matrix cell matters: the
      # mutants matrix is wide, so a per-cell install repeats the download once
      # per cell.
      - name: Install tools
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }},sccache,cargo-nextest

      - name: Stage tools
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-mutants/bin"
          for t in cargo-mutants sccache cargo-nextest; do
            cp "$(command -v "$t")" "$RUNNER_TEMP/cargo-mutants/bin/$t"
          done

      # One artifact for the whole bin directory, not one per binary: adding a
      # tool is then a single line above, and each matrix cell does one download
      # instead of one per tool.
      - name: Upload tools
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/cargo-mutants/bin
          overwrite: true

  wasm-fixtures:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 2 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'mutants' || inputs.suite == 'all'))
    name: Prepare wasm fixtures
    runs-on: self-hosted
    needs: stellar-tool
    steps:
      - uses: actions/checkout@v7

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Download stellar-cli
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}
          path: .github/tools

      - name: Add stellar-cli to PATH
        run: |
          chmod +x .github/tools/stellar
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Build wasm fixtures
        env:
          CARGO_TARGET_DIR: target-mutants
        run: make build

      - name: Stage fixtures
        env:
          CARGO_TARGET_DIR: target-mutants
        run: |
          set -euo pipefail
          src=target-mutants/wasm32v1-none/release
          dst="$RUNNER_TEMP/wasm-fixtures"
          mkdir -p "$dst"
          for w in pool controller price_aggregator; do
            cp "$src/$w.wasm" "$dst/$w.wasm"
          done
          grep -aq set_swap_aggregator "$dst/controller.wasm" \
            || { echo "controller.wasm is missing the set_swap_aggregator export" >&2; exit 1; }
          (cd "$dst" && sha256sum ./*.wasm > SHA256SUMS)
          cat "$dst/SHA256SUMS"

      - name: Upload wasm fixtures
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/wasm-fixtures/
          overwrite: true

  fuzz-long:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 14 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'fuzz' || inputs.suite == 'all'))
    name: Fuzz long (${{ matrix.target }})
    runs-on: self-hosted
    needs: stellar-tool
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: fp_math
            kind: function
          - target: rates_and_index
            kind: function
          - target: fp_ops
            kind: function
          - target: flow_e2e
            kind: contract
          - target: flow_strategy
            kind: contract
          - target: pool_native
            kind: contract
    steps:
      - uses: actions/checkout@v7

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz (prebuilt)
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-fuzz

      # Only build artifacts are cached, never ~/.cargo. Every self-hosted
      # runner instance shares one CARGO_HOME (/home/truststaking/.cargo), so
      # the registry is global while the jobs are concurrent. Cargo itself is
      # safe there -- it serialises on .package-cache -- but actions/cache
      # knows nothing of that lock and unpacks its tarball straight over the
      # live registry, so a job compiling at that moment can read a
      # half-written crate source. That is the base64 E0583 in run 31214351035.
      # The registry needs no cache anyway: it persists on the runner.
      - name: Cache cargo build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
            tests/fuzz/target
          key: ${{ runner.os }}-fuzz-v2-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'tests/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-v2-

      - name: Download stellar-cli
        if: matrix.kind == 'contract'
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}
          path: .github/tools

      - name: Add stellar-cli to PATH
        if: matrix.kind == 'contract'
        run: |
          chmod +x .github/tools/stellar
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Build pool WASM
        if: matrix.kind == 'contract'
        run: stellar contract build

      - name: Run fuzz target
        env:
          FUZZ_TIME: ${{ env.FUZZ_TIME_INPUT || (github.event.schedule == '0 14 * * 0' && '7200' || '1800') }}
          CARGO_BUILD_JOBS: "1"
        run: make fuzz-one TARGET="${{ matrix.target }}" FUZZ_TIME="$FUZZ_TIME"

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/fuzz/artifacts/${{ matrix.target }}/

  proptest-long:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 14 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'proptest' || inputs.suite == 'all'))
    name: Proptest (${{ matrix.test }})
    runs-on: self-hosted
    needs: stellar-tool
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        test:
          - prop_accounting_conservation
          - prop_liquidation_matches_bigrational_reference
          - prop_valid_multiply_fits_default_budget
          - prop_multiply_succeeds_with_safe_hf_and_clean_router
          - prop_swap_collateral_conserves_position_delta
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      # Only build artifacts are cached, never ~/.cargo. Every self-hosted
      # runner instance shares one CARGO_HOME (/home/truststaking/.cargo), so
      # the registry is global while the jobs are concurrent. Cargo itself is
      # safe there -- it serialises on .package-cache -- but actions/cache
      # knows nothing of that lock and unpacks its tarball straight over the
      # live registry, so a job compiling at that moment can read a
      # half-written crate source. That is the base64 E0583 in run 31214351035.
      # The registry needs no cache anyway: it persists on the runner.
      - name: Cache cargo build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
          key: ${{ runner.os }}-proptest-v2-${{ matrix.test }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proptest-v2-

      - name: Download stellar-cli
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}
          path: .github/tools

      - name: Add stellar-cli to PATH
        run: |
          chmod +x .github/tools/stellar
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Build pool WASM
        run: stellar contract build

      - name: Run proptest property
        env:
          PROPTEST_CASES: ${{ env.PROPTEST_CASES_INPUT || (github.event.schedule == '0 14 * * 0' && '50000' || '5000') }}
          CARGO_BUILD_JOBS: "1"
        run: make proptest-one TEST="${{ matrix.test }}" PROPTEST_CASES="$PROPTEST_CASES"

      - name: Upload proptest regressions on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: proptest-regressions-${{ matrix.test }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-harness/tests/fuzz/*.proptest-regressions

  mutants:
    if: >-
      (github.event_name == 'schedule' &&
      startsWith(github.event.schedule, '0 2 ')) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'mutants' || inputs.suite == 'all'))
    name: Mutants (${{ matrix.target }}${{ matrix.suffix || '' }})

    runs-on: self-hosted
    needs: [stellar-tool, mutants-tool, wasm-fixtures]

    timeout-minutes: 360
    strategy:
      fail-fast: false

      # An upper bound, not a measurement: the pool happened to serve 5 lanes in
      # run 31264146755, but host contention is cross-job (sibling matrices run
      # concurrently) and is owned by the adaptive "Size the worker budget"
      # step below. Capping at the observed number could only forfeit
      # throughput once runners come back online.
      max-parallel: 8

      # Cells are listed longest-first: GitHub dispatches matrix cells in order,
      # and the long poles must claim lanes before the short ones, or they start
      # late and become the tail.
      #
      # Shard counts were balanced against run 31264146755, which predates the
      # sharding fix and so measured every shard as pass 1 plus its slice --
      # treat them as a starting point, not a measurement. The run step prints
      # scope and elapsed time to the job summary; re-balance from that.
      matrix:
        include:
          # Sole critical path at 3h02: the other 13 cells finished 55 min ahead
          # of it.
          - target: mutants-common
            shard: 0/4
            suffix: "-1of4"
          - target: mutants-common
            shard: 1/4
            suffix: "-2of4"
          - target: mutants-common
            shard: 2/4
            suffix: "-3of4"
          - target: mutants-common
            shard: 3/4
            suffix: "-4of4"

          # 1h24 + 1h28 for two shards that were doing the same pass-1 work
          # twice; post-fix each shard owns half of it.
          - target: mutants-controller-core
            shard: 0/2
            suffix: "-1of2"
          - target: mutants-controller-core
            shard: 1/2
            suffix: "-2of2"

          # Split because 1h18 and 1h13 unsharded would each outlast a
          # mutants-common shard and become the new tail.
          - target: mutants-controller-strategies
            shard: 0/2
            suffix: "-1of2"
          - target: mutants-controller-strategies
            shard: 1/2
            suffix: "-2of2"
          - target: mutants-controller-positions
            shard: 0/2
            suffix: "-1of2"
          - target: mutants-controller-positions
            shard: 1/2
            suffix: "-2of2"

          # Was split 2 ways for 22m + 18m. Merged back: two cells each pay a
          # baseline build to save minutes, a net loss once the shards are no
          # longer duplicating pass 1.
          - target: mutants-controller-views

          - target: mutants-swap-aggregator
          - target: mutants-aggregator
          - target: mutants-pool
          - target: mutants-oracle-adapter
          - target: mutants-governance
          - target: mutants-controller-oracle
          - target: mutants-defindex-strategy
    steps:
      - uses: actions/checkout@v7

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Download stellar-cli
        uses: actions/download-artifact@v8.0.1
        with:
          name: stellar-cli-${{ github.run_id }}
          path: .github/tools

      - name: Download mutants tools
        uses: actions/download-artifact@v8.0.1
        with:
          name: mutants-tools-${{ github.run_id }}
          path: .github/tools

      # No actions/cache here, deliberately. This job's warm build state comes
      # from the runner's own disk: target-mutants is gitignored, so it survives
      # actions/checkout between runs, and RUSTC_WRAPPER=sccache backs it with a
      # 50G local cache. Adding a hosted cache on top would be worse than
      # nothing -- the repo already holds ~8.3G across 19 entries against a 10G
      # limit, and the mutants-diff job's own entries are currently absent,
      # evicted. Eighteen more multi-gigabyte entries would evict the fuzz and
      # proptest caches that do work, and still pay 18 uploads every run.
      #
      # target-mutants persisting locally is what makes the next step
      # load-bearing rather than cache hygiene.

      # cargo-mutants writes mutated sources into the tree and builds them, and
      # target-mutants survives from the previous run, so it can hold objects
      # built from a mutant rather than from clean source. Touching every
      # tracked .rs file forces cargo to rebuild anything derived from them.
      - name: Invalidate any mutant-built artifacts left on the runner
        run: git ls-files -z '*.rs' | xargs -0 touch

      - name: Download wasm fixtures
        uses: actions/download-artifact@v8.0.1
        with:
          name: wasm-fixtures-${{ github.run_id }}
          path: target-mutants/wasm32v1-none/release

      - name: Add tools to PATH
        run: |
          chmod +x .github/tools/*
          echo "$PWD/.github/tools" >> "$GITHUB_PATH"

      - name: Configure fast host linker
        shell: bash
        run: |
          if command -v mold >/dev/null 2>&1; then
            linker=mold
            mold --version
          elif command -v ld.lld >/dev/null 2>&1; then
            linker=lld
            ld.lld --version
          else
            echo "Install mold (preferred) or lld on the self-hosted runner." >&2
            exit 1
          fi
          command -v cc >/dev/null 2>&1 || {
            echo "A C compiler driver (cc) is required for the fast linker." >&2
            exit 1
          }
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=$linker" >> "$GITHUB_ENV"







      - name: Size the worker budget to this host
        run: |
          case "$(hostname)" in
            Ubuntu-2004-focal-64-minimal) services=4 ;;
            v2202503260965324980)         services=3 ;;
            *)                            services=4 ;;
          esac
          cores=$(nproc)
          workers=$(( cores / services ))
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "host=$(hostname) cores=$cores mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          echo "services=$services workers_per_lane=$workers in_flight=$(( services * workers ))"
          echo "MUTANTS_JOBS=$workers" >> "$GITHUB_ENV"
          echo "MUTANTS_JOBSERVER_TASKS=$workers" >> "$GITHUB_ENV"

      - name: Run mutation target

        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TARGET_DIR: target-mutants




          MUTANTS_FIXTURES_PREBUILT: "1"
          RUST_TEST_THREADS: "1"
          # nextest ignores RUST_TEST_THREADS; without this it would fan out to
          # one process per core inside a lane that is already sized to share
          # the host with the other runner services.
          NEXTEST_TEST_THREADS: "1"
          RUSTC_WRAPPER: sccache
          SCCACHE_CACHE_SIZE: 50G
        # nextest matches the PR-diff job and gives per-test timeouts, which is
        # what --minimum-test-timeout relies on to catch a mutant that hangs
        # rather than fails. Safe here because the crates under mutation have no
        # runnable doctests, the one thing nextest cannot execute.
        #
        # Elapsed time lands in the job summary so the shard counts in the
        # matrix can be re-balanced by reading one page, rather than by
        # archaeology against a run id that ages out of retention.
        run: |
          start=$SECONDS
          status=0
          make "${{ matrix.target }}" \
            MUTANTS_SHARD="${{ matrix.shard || '' }}" \
            MUTANTS_TEST_TOOL=nextest || status=$?
          printf '%s%s\t%dm\n' \
            "${{ matrix.target }}" "${{ matrix.suffix || '' }}" \
            "$(( (SECONDS - start) / 60 ))" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-artifacts-${{ matrix.target }}${{ matrix.suffix || '' }}-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            mutants.out/
            mutants.out.old/
          if-no-files-found: ignore
          retention-days: 7
