name: Tests

on:
  pull_request:
    branches: [master, main, feat/*, rc/*]
    paths:
      - "contracts/**"
      - "common/**"
      - "interfaces/**"
      - "tests/**"
      - "certora/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_VERSION: "27.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Reset workspace
        run: |
          git reset --hard
          git clean -ffdx

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Install sccache (prebuilt)
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: sccache

      - name: Build deploy artifacts and WASM size budget
        run: make wasm-size-check

      - name: Run tests
        run: cargo test --workspace --features price-aggregator/testing

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --features price-aggregator/testing -- -D warnings

      - name: Clippy (fuzz crate, workspace-excluded)
        run: make clippy-fuzz
