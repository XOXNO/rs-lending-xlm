name: Security Scan

on:
  pull_request:
    branches: [master, main, feat/*, rc/*]

    paths:
      - "contracts/**"
      - "common/**"
      - "interfaces/**"
      - "tests/**"
      - "certora/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  access-control:
    name: Access Control Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Reset workspace, preserve target/ build cache
        run: |
          git reset --hard
          git clean -ffdx -e target

      # Source-only and deterministic: no toolchain, no build, no network. Runs
      # in about a second, so it gates the PR long before the Rust jobs finish.
      - name: Every state-changing entrypoint is gated or declared
        run: make access-control-check

  security-scan:
    name: Security Scan (OpenZeppelin)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Isolate rustup toolchain dir
        run: |
          rm -rf "$RUNNER_TEMP/rustup"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Reset workspace, preserve target/ build cache
        run: |
          git reset --hard
          git clean -ffdx -e target

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32v1-none

      - name: Install soroban-scanner

        run: |
          cargo +nightly install --git https://github.com/XOXNO/soroban-security-detectors-sdk \
            --rev 43231611f039c444c4a1db0ef2ef25c3257afff1 \
            soroban-security-detectors-runner

      - name: Run security detectors

        run: .github/scripts/run_scanner.sh

      - name: Run security detectors (strict)
        if: github.event_name == 'pull_request'
        run: |
          .github/scripts/run_scanner.sh | tee scan-results.txt
          if grep -q "CRITICAL\|HIGH" scan-results.txt; then
            echo "::error::Security scan found CRITICAL or HIGH severity issues"
            exit 1
          fi
