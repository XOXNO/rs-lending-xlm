name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  id-token: write
  contents: write
  attestations: write

env:
  STELLAR_VERSION: "28.0.0"
  # Every deployable contract, named as its artifacts/wasm/deploy file. The
  # package and checksum steps read this one list.
  RELEASE_CONTRACTS: controller pool governance price_aggregator position_nft defindex_strategy aggregator xoxno-oracle-adapter

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release WASM
    runs-on: ubuntu-latest
    steps:
      - name: A manual run starts on the release tag
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/tags/{0}', inputs.tag)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::error::Run it on the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Build deploy artifacts and WASM size budget
        run: make wasm-size-check

      # The swap aggregator and the oracle adapter are built by their own
      # targets, outside the size-budgeted set, into the same deploy dir.
      - name: Build swap aggregator and oracle adapter
        run: make build-aggregator build-oracle-adapter

      - name: Package release WASM
        run: |
          mkdir -p dist
          for c in $RELEASE_CONTRACTS; do
            cp "artifacts/wasm/deploy/${c}.wasm" "dist/${c}.wasm"
          done
          ls -lh dist/*.wasm

      - name: SHA256 checksums
        run: |
          cd dist
          for c in $RELEASE_CONTRACTS; do
            sha256sum "${c}.wasm" > "${c}.wasm.sha256"
          done
          cat ./*.wasm.sha256

      - name: Package the xoxno-contract-sdk bundle
        run: python3 scripts/sdk_manifest.py dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.wasm
            dist/sdk-manifest.json

      - name: Upload to release (on published release)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.wasm dist/*.wasm.sha256 dist/sdk-manifest.json --clobber

      - name: Upload to release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.wasm dist/*.wasm.sha256 dist/sdk-manifest.json --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm
          path: |
            dist/*.wasm
            dist/*.wasm.sha256
            dist/sdk-manifest.json
          if-no-files-found: error

  testnet-e2e:
    name: Testnet e2e
    needs: build

    permissions:
      contents: write

    runs-on: self-hosted
    timeout-minutes: 120

    concurrency:
      group: testnet-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Install harness tools

        run: |
          if command -v jq >/dev/null 2>&1 && command -v xxd >/dev/null 2>&1; then
            echo "jq + xxd already present"; exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q jq xxd

      - name: Build integration WASM
        run: make integration-wasm

      - name: Run parallel testnet e2e
        env:
          RUN_TS: release-${{ github.run_id }}
        run: bash tests/integration/scenarios/parallel_e2e.sh

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testnet-e2e-report
          path: |
            tests/integration/runs/release-${{ github.run_id }}-combined.md
            tests/integration/runs/release-${{ github.run_id }}-*/report.md
            tests/integration/runs/release-${{ github.run_id }}-*/actions.tsv
            tests/integration/runs/release-${{ github.run_id }}-*.log
          if-no-files-found: error

      - name: Attach report to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TS: release-${{ github.run_id }}
        run: |
          cp "tests/integration/runs/${RUN_TS}-combined.md" "testnet-e2e-report-${RELEASE_TAG}.md"
          gh release upload "$RELEASE_TAG" \
            "testnet-e2e-report-${RELEASE_TAG}.md" \
            --clobber
