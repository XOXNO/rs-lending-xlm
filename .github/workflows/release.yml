name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
      dry_run:
        description: "Verify the full release gate without publishing (branch refs allowed)"
        type: boolean
        default: true
      inject_e2e_failure:
        description: "Dry run only: fail the E2E job before deployment to prove publication is blocked"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STELLAR_VERSION: "28.0.0"
  # Every deployable contract, named as its artifacts/wasm/deploy file. The
  # package and checksum steps read this one list.
  RELEASE_CONTRACTS: controller pool governance price_aggregator position_nft defindex_strategy aggregator xoxno-oracle-adapter

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release WASM
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.checkout.outputs.commit }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: A manual run starts on the release tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && (inputs.tag == '' || github.ref != format('refs/tags/{0}', inputs.tag))
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::error::Run it on the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Build canonical candidate
        run: make candidate-wasm candidate-size-check integration-fixtures

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Offline pinned SDK RPC fixtures
        run: |
          npm ci --ignore-scripts --prefix tests/integration/sdk
          make integration-sdk-validate

      - name: Offline harness and contract checks
        env:
          STRESS_BUDGET_WASM_DIR: ${{ github.workspace }}/artifacts/wasm/deploy
        run: |
          set -o pipefail
          make integration-validate
          cargo test --workspace --no-fail-fast 2>&1 | tee controlled-tests.log
          python3 tests/integration/controlled.py controlled-tests.log artifacts/wasm/deploy

      - name: Package release WASM
        run: |
          mkdir -p dist
          for c in $RELEASE_CONTRACTS; do
            cp "artifacts/wasm/deploy/${c}.wasm" "dist/${c}.wasm"
          done
          cp artifacts/wasm/deploy/candidate.json dist/
          cp artifacts/wasm/deploy/controlled.json artifacts/wasm/deploy/controlled-tests.log dist/
          ls -lh dist/*.wasm

      - name: SHA256 checksums
        run: |
          cd dist
          for c in $RELEASE_CONTRACTS; do
            sha256sum "${c}.wasm" > "${c}.wasm.sha256"
          done
          cat ./*.wasm.sha256

      - name: Package the xoxno-contract-sdk bundle
        run: python3 scripts/sdk_manifest.py dist

      - name: Bind complete distribution
        run: python3 tests/integration/artifacts.py distribution-create dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.wasm
            dist/sdk-manifest.json
            dist/distribution.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm
          path: |
            dist/*.wasm
            dist/*.wasm.sha256
            dist/sdk-manifest.json
            dist/candidate.json
            dist/distribution.json
            dist/controlled.json
            dist/controlled-tests.log
          if-no-files-found: error

      - name: Checksum separate E2E fixtures
        working-directory: artifacts/wasm/fixtures
        run: sha256sum ./*.wasm > SHA256SUMS
      - name: Upload separate E2E fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-fixtures
          path: |
            artifacts/wasm/fixtures/*.wasm
            artifacts/wasm/fixtures/SHA256SUMS
          if-no-files-found: error

      - name: Upload offline verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-ledger-log
          path: controlled-tests.log
          if-no-files-found: warn

  testnet-e2e:
    name: Testnet e2e
    needs: build

    permissions:
      contents: read

    # The injected failure sends no transactions and needs no live-runner state.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.inject_e2e_failure && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 150

    concurrency:
      group: testnet-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Install harness tools

        run: |
          if command -v jq >/dev/null 2>&1 && command -v xxd >/dev/null 2>&1; then
            echo "jq + xxd already present"; exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q jq xxd

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wasm
          path: artifacts/wasm/deploy

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-fixtures
          path: artifacts/wasm/fixtures
      - name: Verify candidates and separate fixtures
        run: |
          python3 tests/integration/artifacts.py distribution-check artifacts/wasm/deploy
          (cd artifacts/wasm/fixtures && sha256sum --strict --check SHA256SUMS)

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned published SDK
        run: npm ci --ignore-scripts --prefix tests/integration/sdk

      - name: Inject failed E2E gate for dry-run verification
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.inject_e2e_failure
        run: |
          echo "::error::Deliberate E2E failure: publish job must be skipped. No live transactions sent."
          exit 1

      - name: Run parallel testnet e2e
        env:
          NETWORK: testnet
          RUN_TS: release-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tests/integration/scenarios/parallel_e2e.sh

      - name: Bind full E2E proof to candidate
        env:
          RUN_TS: release-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 tests/integration/release_gate.py collect tests/integration/runs "$RUN_TS" artifacts/wasm/deploy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate
          path: tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-release-gate.json
          if-no-files-found: error

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testnet-e2e-report
          path: |
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-combined.md
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/report.md
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/actions.tsv
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/attempts.jsonl
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/cases.tsv
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/evidence.tsv
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/cleanup-funding.tsv
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/before-cleanup.jsonl
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/deployed-artifacts.jsonl
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/*.json
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*/logs/**
            tests/integration/runs/release-${{ github.run_id }}-${{ github.run_attempt }}-*.log
          if-no-files-found: error


  publish:
    name: Publish tested files
    needs: [build, testnet-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wasm
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gate
          path: gate
      - name: Verify tested artifacts before publication
        run: python3 tests/integration/release_gate.py verify dist gate/release-${{ github.run_id }}-${{ github.run_attempt }}-release-gate.json
      - name: Report verified dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "All seven lanes passed; exact tested candidate verified; publication disabled." >> "$GITHUB_STEP_SUMMARY"
          cat dist/candidate.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.wasm dist/*.wasm.sha256 dist/sdk-manifest.json dist/candidate.json dist/distribution.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
