name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  id-token: write
  contents: write
  attestations: write

env:
  STELLAR_VERSION: "28.0.0"
  # Every deployable contract, named as its artifacts/wasm/deploy file, so the
  # release carries all of mainnet. v1.0.0 shipped without price_aggregator,
  # position_nft, aggregator (swap) and xoxno-oracle-adapter because this list
  # was repeated in five steps and only some were updated.
  RELEASE_CONTRACTS: controller pool governance price_aggregator position_nft defindex_strategy aggregator xoxno-oracle-adapter

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Build deploy artifacts and WASM size budget
        run: make wasm-size-check

      # The swap aggregator and the oracle adapter are built by their own
      # targets, outside the size-budgeted set, into the same deploy dir.
      - name: Build swap aggregator and oracle adapter
        run: make build-aggregator build-oracle-adapter

      - name: Package release WASM
        run: |
          mkdir -p dist
          for c in $RELEASE_CONTRACTS; do
            cp "artifacts/wasm/deploy/${c}.wasm" "dist/${c}.wasm"
          done
          ls -lh dist/*.wasm

      - name: SHA256 checksums
        run: |
          cd dist
          for c in $RELEASE_CONTRACTS; do
            sha256sum "${c}.wasm" > "${c}.wasm.sha256"
          done
          cat ./*.wasm.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.wasm

      - name: Upload to release (on published release)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.wasm dist/*.wasm.sha256 --clobber

      - name: Upload to release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.wasm dist/*.wasm.sha256 --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-wasm
          path: |
            dist/*.wasm
            dist/*.wasm.sha256
          if-no-files-found: error

  testnet-e2e:
    name: Testnet e2e
    needs: build

    permissions:
      contents: write

    runs-on: self-hosted
    timeout-minutes: 120

    concurrency:
      group: testnet-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install stellar-cli

        run: bash .github/scripts/install-stellar-cli.sh

      - name: Install harness tools

        run: |
          if command -v jq >/dev/null 2>&1 && command -v xxd >/dev/null 2>&1; then
            echo "jq + xxd already present"; exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q jq xxd

      - name: Build integration WASM
        run: make integration-wasm

      - name: Run parallel testnet e2e
        env:
          RUN_TS: release-${{ github.run_id }}
        run: bash tests/integration/scenarios/parallel_e2e.sh

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testnet-e2e-report
          path: |
            tests/integration/runs/release-${{ github.run_id }}-combined.md
            tests/integration/runs/release-${{ github.run_id }}-*/report.md
            tests/integration/runs/release-${{ github.run_id }}-*/actions.tsv
            tests/integration/runs/release-${{ github.run_id }}-*.log
          if-no-files-found: error

      - name: Attach report to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TS: release-${{ github.run_id }}
        run: |
          cp "tests/integration/runs/${RUN_TS}-combined.md" "testnet-e2e-report-${RELEASE_TAG}.md"
          gh release upload "$RELEASE_TAG" \
            "testnet-e2e-report-${RELEASE_TAG}.md" \
            --clobber
