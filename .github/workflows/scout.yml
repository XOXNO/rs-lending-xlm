name: Scout Audit

on:
  pull_request:
    branches: [master, main, feat/*, rc/*]

    paths:
      - "contracts/**"
      - "common/**"
      - "interfaces/**"
      - "tests/**"
      - "certora/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    name: Scout Audit (advisory)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Reset workspace, preserve target/ build cache
        run: |
          git reset --hard
          git clean -ffdx -e target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Warm Scout detector build
        continue-on-error: true
        uses: mihaieremia/scout-audit@26779da2e72880ba77ab796ee7f71a785ba315f3
        with:
          contracts: contracts/defindex-strategy
          exclude: dos-unexpected-revert-with-storage
          output-format: json
          output-dir: target/scout-audit-warm
          fail-on-severity: critical
          extra-args: "-- --locked"
          upload-reports: false

      - name: Run Scout

        uses: mihaieremia/scout-audit@26779da2e72880ba77ab796ee7f71a785ba315f3
        with:
          # Every deployable contract in the workspace. Mocks are test
          # doubles and are deliberately not audited. Keep in sync with the
          # `contracts` array in .github/scripts/run_scout.sh and the
          # `contracts/*` members of the root Cargo.toml.
          contracts: |
            contracts/pool
            contracts/controller
            contracts/governance
            contracts/price-aggregator
            contracts/defindex-strategy
            contracts/position-nft
            contracts/swap-aggregator
            contracts/xoxno-oracle
          exclude: dos-unexpected-revert-with-storage
          output-format: json
          output-dir: target/scout-audit
          fail-on-severity: critical
          extra-args: "-- --locked"
          upload-reports: true

      - name: Scout summary
        if: always()
        shell: bash
        run: python3 scripts/scout-summary.py target/scout-audit >> "$GITHUB_STEP_SUMMARY"
