version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    cooldown:
      default-days: 7

    groups:
      actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"
      include: "scope"

    open-pull-requests-limit: 5
