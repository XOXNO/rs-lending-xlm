{
    "msg": "Price fail-closed force rejections (revert-shaped, sanity off)",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "32",
    "rule_sanity": "none",
    "multi_assert_check": false,
    "rule": [
        "empty_legs_force_reverts",
        "partial_legs_force_reverts"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-oracle-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/price-aggregator-oracle-rules.wasm"
    ]
}
