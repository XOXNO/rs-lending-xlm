{
    "msg": "Price aggregator scaled-source multiplication math",
    "optimistic_loop": false,
    "precise_bitwise_ops": true,
    "loop_iter": "6",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "scaled_price_pins_half_up_rounding_native",
        "scaled_price_pins_half_up_rounding_widened",
        "scaled_price_rejects_negative_operands",
        "scaled_price_allows_zero_operands",
        "scaled_price_bounded_by_factor_clamp_native",
        "scaled_price_bounded_by_factor_clamp_widened",
        "scaled_price_monotone_in_factor_native",
        "scaled_price_monotone_in_factor_widened",
        "scaled_price_fits_i128_within_price_bounds"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-scaled-math-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 150000",
        "-maxCommandCount 750000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/price-aggregator-scaled-math-rules.wasm"
    ]
