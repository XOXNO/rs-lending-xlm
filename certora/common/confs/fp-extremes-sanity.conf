{
    "msg": "Witnesses that the fixed-point edge fixtures are reachable",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "6",
    "rule_sanity": "none",
    "multi_assert_check": false,
    "rule": [
        "borrow_rate_at_exact_zero_sanity",
        "borrow_rate_at_exact_mid_sanity",
        "borrow_rate_at_exact_optimal_sanity",
        "borrow_rate_at_100_percent_sanity",
        "compound_interest_at_max_rate_max_time_sanity",
        "mul_at_max_i128_sanity",
        "compound_taylor_accuracy_sanity",
        "supply_dust_amount_sanity",
        "roundtrip_supply_sanity",
        "compound_no_wrap_sanity"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-fp-extremes-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 150000",
        "-maxCommandCount 750000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-fp-extremes-rules.wasm"
    ]
}
