{
    "msg": "Common interest-curve and compounding lemmas over a symbolic market",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "6",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "borrow_rate_zero_utilization",
        "borrow_rate_monotonic",
        "borrow_rate_capped",
        "borrow_rate_non_decreasing_at_mid_boundary",
        "borrow_rate_non_decreasing_at_optimal_boundary",
        "deposit_rate_less_than_borrow",
        "compound_interest_monotonic_in_time",
        "compound_interest_monotonic_in_rate",
        "compound_interest_ge_simple",
        "supplier_rewards_conservation"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-rates-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 150000",
        "-maxCommandCount 750000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-rates-rules.wasm"
    ]
}
