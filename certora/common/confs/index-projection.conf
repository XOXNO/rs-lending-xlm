{
    "msg": "Common index projection: zero-time stability, view/accrue isomorphism, time monotonicity",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "1",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "indexes_unchanged_when_no_time_elapsed",
        "iso_market_index_invariant_across_accrual",
        "time_mono_market_index_non_decreasing"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-rate-index-accounting-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-rate-index-accounting-rules.wasm"
    ]
}
