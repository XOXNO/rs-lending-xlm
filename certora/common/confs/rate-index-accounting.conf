{
    "msg": "Kink rates and index monotonicity (common math)",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "8",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "borrow_rate_monotonic_across_utilization",
        "borrow_rate_kinks_match_configured_curve",
        "compound_factor_never_below_one",
        "borrow_index_identity_is_noop",
        "borrow_index_strictly_grows_below_cap",
        "borrow_index_cap_is_sticky",
        "supply_index_zero_inputs_are_noop",
        "supply_index_rounded_zero_value_is_noop",
        "supply_index_reward_distribution_is_conservative",
        "supply_index_high_index_rewards_are_conservative",
        "supply_index_cap_is_sticky",
        "accrued_interest_split_is_conservative_native",
        "accrued_interest_split_is_conservative_widened"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-rate-index-accounting-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 300000",
        "-maxCommandCount 1500000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-rate-index-accounting-rules.wasm"
    ]
}
