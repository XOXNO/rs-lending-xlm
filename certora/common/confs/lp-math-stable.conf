{
    "msg": "Stableswap LP share fair-value math",
    "optimistic_loop": true,
    "precise_bitwise_ops": false,
    "loop_iter": "8",
    "rule_sanity": "basic",
    "multi_assert_check": true,
    "rule": [
        "stable_lp_price_rejects_degenerate_inputs",
        "stable_lp_price_rejects_out_of_range_amp",
        "stable_lp_price_is_symmetric_under_leg_swap",
        "stable_lp_price_tracks_only_the_cheaper_leg"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-lp-math-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 150000",
        "-maxCommandCount 750000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-lp-math-rules.wasm"
    ]
}
