        "-mediumTimeout 20",
        "-maxBlockCount 800000",
        "-maxCommandCount 3000000"
    ],
    "independent_satisfy": true,
    "smt_timeout": "1800",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/common-math-rules.wasm"
    ]
