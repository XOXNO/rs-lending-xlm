{
    "msg": "Common fixed-point behaviour at the edges of its domain",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "6",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "mul_at_max_i128",
        "compound_taylor_accuracy",
        "rescale_ray_to_wad",
        "rescale_wad_to_7_decimals",
        "supply_withdraw_roundtrip_error_bounded",
        "borrow_repay_roundtrip_error_bounded",
        "compound_interest_bounded_output",
        "compound_interest_no_wrap",
        "scaled_to_actual_matches_floor_with_rounding"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-fp-extremes-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 150000",
        "-maxCommandCount 750000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-fp-extremes-rules.wasm"
    ]
}
