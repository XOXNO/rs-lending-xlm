{
    "msg": "Common fixed-point core identities (moved from the controller layer)",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "1",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "mul_half_up_commutative",
        "mul_half_up_zero",
        "mul_half_up_identity",
        "div_half_up_zero_numerator",
        "rescale_upscale_lossless",
        "rescale_roundtrip",
        "i256_no_overflow",
        "split_mul_half_up_bounded",
        "split_mul_div_floor_never_gains",
        "split_mul_div_ceil_never_gains",
        "split_rescale_upscale_exact",
        "split_rescale_downscale_bounded"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-math-rules"
    ],
    "prover_args": [
        "-depth 5",
        "-mediumTimeout 20",
        "-maxBlockCount 150000",
        "-maxCommandCount 750000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "600",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/common-math-rules.wasm"
    ]
}
