    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-spoke-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/controller-spoke-rules.wasm"
    ]
