{
    "msg": "Controller spoke usage across the liquidation legs (V-5): share-credit seizure summed over both principals, and bad-debt cleanup",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "32",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "usage_liq_credit_seize_sums_over_two_accounts",
        "usage_liq_bad_debt_cleanup_sheds_every_wiped_position"
