{
    "msg": "Controller spoke usage reachability witnesses",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "32",
    "rule_sanity": "none",
    "multi_assert_check": false,
    "rule": [
        "usage_supply_reachable",
        "usage_withdraw_reachable",
        "usage_borrow_reachable",
        "usage_repay_reachable",
        "usage_strategy_borrow_leg_reachable",
        "usage_strategy_withdraw_leg_reachable",
        "usage_strategy_repay_leg_reachable",
        "usage_strategy_net_settle_reachable",
        "usage_coverage_dispatch_reachable"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-spoke-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true",
        "-dontStopAtFirstSplitTimeout true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/controller-spoke-rules.wasm"
    ]
}
