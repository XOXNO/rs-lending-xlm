{
    "msg": "Controller flash-position rejections (revert-shaped, sanity off)",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "32",
    "rule_sanity": "none",
    "multi_assert_check": false,
    "rule": [
        "flash_position_rejects_empty_collaterals",
        "flash_position_rejects_zero_amount",
        "flash_position_rejects_all_zero_mins",
        "flash_position_rejects_duplicate_collateral_asset",
        "flash_position_guard_blocks_entrypoint",
        "flash_position_open_rejects_empty_account",
        "flash_position_open_rejects_debt_free",
        "flash_position_rejects_normal_mode",
        "flash_position_rejects_non_flashloanable_market"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-strategy-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/controller-strategy-rules.wasm"
    ]
}
