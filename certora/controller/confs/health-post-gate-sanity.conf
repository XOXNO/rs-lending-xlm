{
    "msg": "Post-pool solvency gate reachability witnesses",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "32",
    "rule_sanity": "none",
    "multi_assert_check": false,
    "rule": [
        "post_gate_borrow_observes_gate_witness",
        "post_gate_withdraw_observes_gate_witness",
        "post_gate_multiply_observes_gate_witness",
        "post_gate_supply_skips_gate_witness",
        "post_gate_repay_skips_gate_witness"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-health-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true",
        "-dontStopAtFirstSplitTimeout true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "1800",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/controller-health-rules.wasm"
    ]
}
