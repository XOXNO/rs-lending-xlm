{
    "msg": "Controller spoke usage liquidation-leg reachability witnesses",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "32",
    "rule_sanity": "none",
    "multi_assert_check": false,
    "rule": [
        "usage_liq_repay_leg_reachable",
        "usage_liq_transfer_seize_leg_reachable",
        "usage_liq_credit_seize_reachable",
        "usage_liq_credit_fee_exits_usage_reachable",
        "usage_liq_bad_debt_cleanup_reachable",
        "credit_zero_liquidation_creates_receiver_in_deprecated_spoke"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-spoke-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true",
        "-dontStopAtFirstSplitTimeout true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/controller-spoke-rules.wasm"
    ]
}
