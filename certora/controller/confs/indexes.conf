{
    "msg": "Controller index stability and view/accrue isomorphism",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "28",
    "rule_sanity": "advanced",
    "multi_assert_check": false,
    "rule": [
        "indexes_unchanged_when_no_time_elapsed",
        "iso_market_index_invariant_across_accrual",
        "iso_health_factor_invariant_across_accrual",
        "iso_update_indexes_writes_no_controller_state",
        "time_mono_market_index_non_decreasing",
        "time_mono_liquidation_estimate_valuation_non_decreasing"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-index-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 2000000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/controller-index-rules.wasm"
    ]
}
