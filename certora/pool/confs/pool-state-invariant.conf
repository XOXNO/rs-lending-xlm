{
  "msg": "Pool persisted-state inductive invariant across every state writer",
  "files": [
    "../../../artifacts/wasm/certora/pool-state-invariant-rules.wasm"
  ],
  "cargo_features": [
    "certora",
    "certora-focused",
    "certora-state-invariant-rules"
  ],
  "rule": [
    "invariant_holds_after_market_create",
    "invariant_preserved_by_supply",
    "invariant_preserved_by_borrow",
    "invariant_preserved_by_withdraw",
    "invariant_preserved_by_repay",
    "invariant_preserved_by_net_settle",
    "invariant_preserved_by_seize_borrow",
    "invariant_preserved_by_seize_deposit",
    "invariant_preserved_by_add_rewards",
    "invariant_preserved_by_claim_revenue",
    "invariant_preserved_by_recapitalize",
    "invariant_preserved_by_create_strategy",
    "invariant_preserved_by_flash_fee_booking",
    "invariant_preserved_by_one_chunk_accrual"
  ],
  "server": "prover",
  "optimistic_loop": false,
  "loop_iter": "28",
  "precise_bitwise_ops": false,
  "rule_sanity": "basic",
  "multi_assert_check": true,
  "independent_satisfy": true,
  "smt_timeout": "1800",
  "global_timeout": "7200",
  "prover_args": [
    "-depth 10",
    "-mediumTimeout 20",
    "-maxBlockCount 400000",
    "-maxCommandCount 2000000",
    "-splitParallel true"
  ]
}
