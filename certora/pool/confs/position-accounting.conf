{
    "msg": "Pool supply borrow withdraw repay accounting",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "28",
    "rule_sanity": "advanced",
    "multi_assert_check": true,
    "rule": [
        "supply_scaled_balance_matches_index",
        "borrow_scaled_debt_matches_index",
        "partial_withdraw_burns_scaled_supply",
        "full_withdraw_burns_entire_position",
        "partial_repay_burns_scaled_debt",
        "full_repay_refunds_overpayment",
        "additivity_supply_split_never_mints_more",
        "additivity_borrow_split_never_reduces_debt",
        "additivity_withdraw_split_never_pays_more",
        "additivity_withdraw_partial_then_close_never_exceeds_full_close",
        "additivity_repay_split_never_burns_more_debt",
        "additivity_net_settle_split_never_favours_caller"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-position-accounting-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 400000",
        "-maxCommandCount 4000000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "7200",
    "files": [
        "../../../artifacts/wasm/certora/pool-position-accounting-rules.wasm"
    ]
}
