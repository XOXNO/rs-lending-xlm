{
  "msg": "Pool market creation and no-op accrual",
  "files": [
    "../../../artifacts/wasm/certora/pool-lifecycle-rules.wasm"
  ],
  "cargo_features": [
    "certora",
    "certora-focused",
    "certora-lifecycle-rules"
  ],
  "rule": [
    "market_create_writes_zeroed_state",
    "accrue_is_noop_when_no_time_elapsed"
  ],
  "server": "prover",
  "optimistic_loop": false,
  "loop_iter": "8",
  "precise_bitwise_ops": false,
  "rule_sanity": "advanced",
  "multi_assert_check": true,
  "independent_satisfy": true,
  "smt_timeout": "300",
  "global_timeout": "1800",
  "prover_args": [
    "-depth 5",
    "-mediumTimeout 20",
    "-maxBlockCount 200000",
    "-maxCommandCount 1000000",
    "-splitParallel true"
  ]
}
