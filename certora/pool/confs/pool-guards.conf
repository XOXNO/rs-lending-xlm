{
    "msg": "Pool utilization, reserve, and solvency guards",
    "optimistic_loop": false,
    "precise_bitwise_ops": false,
    "loop_iter": "28",
    "rule_sanity": "advanced",
    "multi_assert_check": true,
    "rule": [
        "borrow_respects_utilization_cap",
        "user_withdraw_respects_utilization_cap",
        "withdraw_never_overdraws_cash",
        "withdraw_keeps_revenue_backed",
        "net_settle_keeps_revenue_backed",
        "withdraw_leaves_no_orphan_debt",
        "claim_revenue_leaves_no_orphan_debt",
        "pool_trust_repay_refunds_only_payer_surplus",
        "pool_trust_borrow_payout_is_backed_by_pool_cash",
        "pool_trust_revenue_claim_pays_owner_from_pool_cash"
    ],
    "server": "prover",
    "cargo_features": [
        "certora",
        "certora-focused",
        "certora-guard-rules"
    ],
    "prover_args": [
        "-depth 10",
        "-mediumTimeout 20",
        "-maxBlockCount 300000",
        "-maxCommandCount 1500000",
        "-splitParallel true"
    ],
    "independent_satisfy": true,
    "smt_timeout": "900",
    "global_timeout": "3600",
    "files": [
        "../../../artifacts/wasm/certora/pool-guard-rules.wasm"
    ]
}
