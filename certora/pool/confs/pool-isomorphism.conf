{
  "msg": "Pool view/accrue isomorphism",
  "files": [
    "../../../artifacts/wasm/certora/pool-isomorphism-rules.wasm"
  ],
  "cargo_features": [
    "certora",
    "certora-focused",
    "certora-isomorphism-rules"
  ],
  "rule": [
    "iso_pool_views_unchanged_by_zero_time_accrue",
    "iso_pool_views_fixed_point_after_accrue",
    "iso_accrue_preserves_cash_and_params",
    "iso_unaccrued_views_lag_accrued_values"
  ],
  "server": "prover",
  "optimistic_loop": false,
  "loop_iter": "28",
  "precise_bitwise_ops": false,
  "rule_sanity": "basic",
  "multi_assert_check": true,
  "independent_satisfy": true,
  "smt_timeout": "1800",
  "global_timeout": "7200",
  "prover_args": [
    "-depth 10",
    "-mediumTimeout 20",
    "-maxBlockCount 400000",
    "-maxCommandCount 4000000",
    "-splitParallel true"
  ]
}
