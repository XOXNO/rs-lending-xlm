{
  "msg": "Pool duplicate market creation must revert",
  "files": [
    "../../../artifacts/wasm/certora/pool-lifecycle-rules.wasm"
  ],
  "cargo_features": [
    "certora",
    "certora-focused",
    "certora-lifecycle-rules"
  ],
  "rule": [
    "market_duplicate_create_reverts"
  ],
  "server": "prover",
  "optimistic_loop": false,
  "loop_iter": "28",
  "precise_bitwise_ops": false,
  "rule_sanity": "basic",
  "multi_assert_check": false,
  "independent_satisfy": true,
  "smt_timeout": "300",
  "global_timeout": "1800",
  "prover_args": [
    "-depth 5",
    "-mediumTimeout 20",
    "-maxBlockCount 200000",
    "-maxCommandCount 1000000",
    "-splitParallel true"
  ]
}
