network: mainnet

rpc:
  # Preference order: the in-cluster node first, then public endpoints.
  # stellar-gateway.xoxno.com is not listed: it fronts the first node and adds
  # no redundancy. Reads and simulations walk this list; submission stays on
  # the endpoint that answered last.
  urls:
    - http://stellar-rpc-mainnet:8080
    - https://mainnet.sorobanrpc.com
    - https://soroban-rpc.mainnet.stellar.gateway.fm
  passphrase: "Public Global Stellar Network ; September 2015"
  timeout_seconds: 30

