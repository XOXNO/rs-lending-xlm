# Mainnet config for the lending metrics exporter.
#
# Markets / hubs / spokes mirror configs/mainnet/{markets,hubs,spokes}.json.
# Contract IDs mirror configs/networks.json when present.
#
# Controller (and optionally price_aggregator) must be filled from
# configs/networks.json after mainnet deploy — the exporter refuses to
# boot until contracts.controller is a valid C… address.
# Pool + price-aggregator are also resolved each scrape from controller
# views; YAML price_aggregator is only a fallback.
network: mainnet
rpc:
  # Coolify shared-network alias (stellar-rpc-mainnet → :8080). Requires the
  # exporter container to be attached to the `coolify` Docker network.
  # Public fallback: https://stellar-gateway.xoxno.com
  url: http://stellar-rpc-mainnet:8080
  passphrase: "Public Global Stellar Network ; September 2015"
  timeout_seconds: 30
contracts:
  # From configs/networks.json — empty until mainnet controller is deployed.
  controller: ""
  # Optional fallback if controller.price_aggregator view is unavailable.
  price_aggregator: ""
  # Spiko / xoxno adapter (provider probes); RedStone legs resolve from oracle config.
  xoxno_oracle_adapter: "CDA3XS2HETVCW5GSRN3FH4X3YJ45IA6DNVSZTEOYDFGOCXQK4ZJG22JM"
