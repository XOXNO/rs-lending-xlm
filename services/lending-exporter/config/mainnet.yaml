# On-chain spoke ids, not the config ids in configs/mainnet/spokes.json. The
# two diverge because config spoke 3 (Spiko RWA) is deferred, so every later
# spoke shifted down by one when it was created. configs/networks.json
# `mainnet.spoke_ids` holds the config -> on-chain map and is the source of
# truth; `get_spoke` takes the on-chain id.
spokes: [1, 2, 3, 4, 5, 6, 7, 8]

hubs:
  1: Core
  2: RWA
  3: AMM

# Keyed by on-chain spoke id, matching `spokes` above. Spiko RWA is absent
# because it has no on-chain id yet; creating it will append id 9, so add
# `9: Spiko RWA` here at the same time. Unlisted ids fall back to "Spoke {id}".
spoke_names:
  1: Blue Chip
  2: Etherfuse RWA
  3: Centrifuge RWA
  4: Stables & FX
  5: AMM Collateral
  6: Ondo RWA
  7: Commodities
  8: Aquarius Ecosystem
