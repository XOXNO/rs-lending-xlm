








scrape_configs:
  - job_name: stellar-lending-exporter-testnet
    metrics_path: /metrics
    static_configs:
      - targets: ['lending-exporter-testnet:9110']

  - job_name: stellar-lending-exporter-mainnet
    metrics_path: /metrics
    static_configs:
      - targets: ['lending-exporter-mainnet:9110']

# No static `network` label: the exporter already emits `network` from its config.
# Adding it here would collide and rename the exporter's own label to `exported_network`.
