[package]
name = "curator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../common" }
governance-interface = { path = "../../interfaces/governance" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
controller = { path = "../controller" }
governance = { path = "../governance", features = ["testing"] }
