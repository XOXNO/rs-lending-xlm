[package]
name = "governance"
version = "0.1.0"
edition = "2021"

autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-governance = { workspace = true }
stellar-macros = { workspace = true }
common = { path = "../../common" }
controller-interface = { path = "../../interfaces/controller" }
governance-interface = { path = "../../interfaces/governance" }
price-aggregator-interface = { path = "../../interfaces/price-aggregator" }

[features]
testing = []
# End-to-end build only: lowers the sensitive timelock floor to 12 ledgers and
# stamps the Wasm with a `timelock` meta entry. Never enable it for a deploy or
# release artifact; `tests/integration/artifacts.py` rejects a candidate that
# carries the stamp.
short-timelock = []

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-contract-utils = { workspace = true }
controller = { path = "../controller", features = ["testing"] }
price-aggregator = { path = "../price-aggregator", features = ["testing"] }
