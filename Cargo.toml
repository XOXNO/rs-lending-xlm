[workspace]
members = [
    "common",
    "interfaces/pool",
    "interfaces/controller",
    "interfaces/governance",
    "interfaces/price-aggregator",
    "interfaces/swap-aggregator",
    "interfaces/position-nft",
    "contracts/pool",
    "contracts/controller",
    "contracts/governance",
    "contracts/swap-aggregator",
    "contracts/defindex-strategy",
    "contracts/xoxno-oracle",
    "contracts/price-aggregator",
    "contracts/position-nft",
    "mock/mock-oracle",
    "mock/mock-redstone",
    "mock/flash-loan-receiver",
    "mock/flash-position-receiver",
    "mock/script-runner",
    "mock/production-fixture",
    "tests/test-harness",
]
exclude = ["tests/fuzz", "vendor"]
resolver = "2"

[workspace.dependencies]

soroban-sdk = "=28.0.0"
stellar-access = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "59b98f8e127f0e877a3870e8eb82fa282a4aadf3" }
stellar-contract-utils = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "59b98f8e127f0e877a3870e8eb82fa282a4aadf3" }
stellar-governance = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "59b98f8e127f0e877a3870e8eb82fa282a4aadf3" }
stellar-macros = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "59b98f8e127f0e877a3870e8eb82fa282a4aadf3" }
stellar-tokens = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "59b98f8e127f0e877a3870e8eb82fa282a4aadf3" }

cvlr = { git = "https://github.com/Certora/cvlr.git", rev = "b8bfb4c9587ad1e6576a74506fb1ae1a7006cd1b", default-features = false }
cvlr-soroban = { git = "https://github.com/Certora/cvlr-soroban.git", rev = "5ff9d010e2d322c2291697c07e850759f850f245" }
cvlr-soroban-macros = { git = "https://github.com/Certora/cvlr-soroban.git", rev = "5ff9d010e2d322c2291697c07e850759f850f245" }
cvlr-soroban-derive = { git = "https://github.com/Certora/cvlr-soroban.git", rev = "5ff9d010e2d322c2291697c07e850759f850f245" }

# Vendored cvlr-log expands `cvlr_rule_location!`, which `#[rule]` inserts into every
# rule, with `::core::file!()` and `::core::line!()`. Upstream (b8bfb4c) uses `std::`,
# which does not resolve in a `#![no_std]` crate such as the controller.
[patch."https://github.com/Certora/cvlr.git"]
cvlr-log = { path = "vendor/cvlr-log" }

# Vendored cvlr-soroban repins soroban-sdk to =28.0.0. Upstream (Certora/cvlr-soroban
# 5ff9d01) pins "26.1.0", which resolves to <27 and puts two soroban-sdk majors in
# the graph: the `certora` feature then fails to compile with Address type mismatches.
# The vendored tree is that rev with only the workspace pin changed. Drop this patch
# once upstream moves to soroban-sdk 28.
[patch."https://github.com/Certora/cvlr-soroban.git"]
cvlr-soroban = { path = "vendor/cvlr-soroban/cvlr-soroban" }
cvlr-soroban-macros = { path = "vendor/cvlr-soroban/cvlr-soroban-macros" }
cvlr-soroban-derive = { path = "vendor/cvlr-soroban/cvlr-soroban-derive" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = "fat"
