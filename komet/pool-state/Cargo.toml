[package]
name = "pool-state-proof"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
common = { path = "../../common" }
pool = { path = "../../contracts/pool" }
pool-interface = { path = "../../interfaces/pool" }
soroban-sdk = "=28.0.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 1
strip = "none"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = "fat"
